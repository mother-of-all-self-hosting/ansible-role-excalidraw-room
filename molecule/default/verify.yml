# Verifies the pre-built image Excalidraw publishes on Docker Hub, which this role uses when
# `excalidraw_room_container_image_self_build` is turned off.
#
# That image was built once, in December 2023, from `FROM node:12-alpine`. Node.js 12 left
# support in April 2022. This scenario asserts that this is what is running - including its
# elderly Node.js - which is at the same time the negative control for the self-build scenario's
# version assertion: the two must not agree.

---
- name: Verify Excalidraw collaboration server
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify that Excalidraw collaboration server works
      block:
        - name: Run the shared Excalidraw collaboration server verification tasks
          ansible.builtin.include_tasks: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/molecule/verify_tasks.yml"

        ########################################################################
        #                                                                      #
        # the image is the one defaults/main.yml names                         #
        #                                                                      #
        ########################################################################

        # The collaboration server publishes no versions, so there is no version to assert here:
        # `excalidraw/excalidraw-room` carries one usable tag beside a set of `sha-*` ones, and
        # the image has no version label of its own. The most that can be checked is that the
        # tag the role resolved is the tag that is running.
        - name: Assert that the running container is the image defaults/main.yml resolves to
          ansible.builtin.assert:
            that:
              - excalidraw_room_molecule_container.Config.Image is search('excalidraw/excalidraw-room:')
              - excalidraw_room_molecule_container.Config.Image.endswith(':' ~ excalidraw_room_role_defaults.excalidraw_room_version)
            fail_msg: >-
              The container runs {{ excalidraw_room_molecule_container.Config.Image }}, which is not
              excalidraw/excalidraw-room at the
              '{{ excalidraw_room_role_defaults.excalidraw_room_version }}' tag
              `excalidraw_room_version` names
            success_msg: >-
              The container runs {{ excalidraw_room_molecule_container.Config.Image }}, the tag
              `excalidraw_room_version` names

        ########################################################################
        #                                                                      #
        # the runtime, which is the negative control for the self-build        #
        #                                                                      #
        ########################################################################

        - name: Ask the pre-built image which Node.js it carries
          ansible.builtin.command:
            cmd: docker exec excalidraw-room node --version
          register: excalidraw_room_node_version
          changed_when: false

        - name: Read what the pre-built image runs as PID 1
          ansible.builtin.command:
            cmd: docker exec excalidraw-room sh -c 'tr "\0" " " < /proc/1/cmdline'
          register: excalidraw_room_pid1
          changed_when: false

        # The self-build scenario asserts that the Node.js it runs is exactly the release
        # `excalidraw_room_container_image_self_build_base_image_tag` pins. That assertion is
        # only worth something if the image the role would otherwise pull runs a different one,
        # which is what this says. It is also what would notice if Excalidraw ever rebuilt their
        # image, which has not moved since 2023.
        - name: Assert that the pre-built image is not running the Node.js the self-build pins
          vars:
            excalidraw_room_molecule_pinned_node: "v{{ excalidraw_room_role_defaults.excalidraw_room_container_image_self_build_base_image_tag | regex_replace('-.*$', '') }}"
          ansible.builtin.assert:
            that:
              - excalidraw_room_node_version.stdout | trim != excalidraw_room_molecule_pinned_node
              - excalidraw_room_pid1.stdout is search('yarn')
            fail_msg: >-
              The pre-built image runs Node.js {{ excalidraw_room_node_version.stdout | trim }} as
              `{{ excalidraw_room_pid1.stdout | trim }}`. It was expected to differ from the
              {{ excalidraw_room_molecule_pinned_node }} the self-build pins, and to start through
              Yarn. If Excalidraw has rebuilt their image, the self-build scenario's version
              assertion needs re-checking rather than this one relaxing.
            success_msg: >-
              The pre-built image runs Node.js {{ excalidraw_room_node_version.stdout | trim }} as
              `{{ excalidraw_room_pid1.stdout | trim }}`, which is not the
              {{ excalidraw_room_molecule_pinned_node }} the self-build pins

        ########################################################################
        #                                                                      #
        # the labels the role renders for Traefik                              #
        #                                                                      #
        ########################################################################

        # This scenario turns the Traefik labels on (the self-build one leaves them off, and
        # asserts they are absent) so that `templates/labels.j2` is exercised. No Traefik is
        # running to read them, but the labels are rendered from the role's variables and reach
        # the container through `--label-file`, so what they say is a statement about the role.
        - name: Assert that the Traefik labels the role renders reached the container
          vars:
            # `.get()` rather than `[...]`, so that a container carrying no Traefik labels at
            # all reports what it is missing instead of raising a template error about it.
            excalidraw_room_molecule_labels: "{{ excalidraw_room_molecule_container.Config.Labels | default({}) }}"
          ansible.builtin.assert:
            that:
              - excalidraw_room_molecule_labels.get('traefik.enable') == 'true'
              - excalidraw_room_molecule_labels.get('traefik.docker.network') == 'excalidraw-room'
              - excalidraw_room_molecule_labels.get('traefik.http.routers.excalidraw-room.rule') == 'Host(`' ~ excalidraw_room_hostname ~ '`)'
              - excalidraw_room_molecule_labels.get('traefik.http.routers.excalidraw-room.entrypoints') == excalidraw_room_container_labels_traefik_entrypoints
              - excalidraw_room_molecule_labels.get('traefik.http.services.excalidraw-room.loadbalancer.server.port') == excalidraw_room_container_http_port | string
              - excalidraw_room_molecule_labels.get('traefik.http.middlewares.excalidraw-room-add-response-headers.headers.customresponseheaders.X-Content-Type-Options') == 'nosniff'
            fail_msg: "The container's labels are {{ excalidraw_room_molecule_labels }}"
            success_msg: >-
              The container carries the Traefik router, service and response-header labels
              templates/labels.j2 renders, routing `{{ excalidraw_room_hostname }}` to container
              port {{ excalidraw_room_container_http_port }}

        - name: Show Excalidraw collaboration server verification summary
          ansible.builtin.debug:
            msg:
              - "Excalidraw collaboration server systemd: {{ excalidraw_room_service.status.ActiveState }}"
              - "Excalidraw collaboration server image: {{ excalidraw_room_molecule_container.Config.Image }} on Node.js {{ excalidraw_room_node_version.stdout | trim }}"
              - "Excalidraw collaboration server published: container {{ excalidraw_room_container_http_port }} on host {{ excalidraw_room_container_http_host_bind_port }}"
              - "Excalidraw collaboration server allowed origin: {{ excalidraw_room_cors.access_control_allow_origin }}"
              - "Excalidraw collaboration server collaboration: two Socket.IO clients relayed a scene through a shared room"
      rescue:
        # Whatever went wrong, the reason is almost always in the service log.
        - name: Retrieve the Excalidraw collaboration server service log
          ansible.builtin.command:
            cmd: journalctl --no-pager -xeu excalidraw-room.service
          register: excalidraw_room_service_log
          changed_when: false

        - name: Show the Excalidraw collaboration server service log
          ansible.builtin.debug:
            var: excalidraw_room_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Excalidraw collaboration server verification failed. The service log is printed above."
