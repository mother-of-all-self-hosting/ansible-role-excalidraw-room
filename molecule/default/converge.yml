---
- name: Include roles for Excalidraw collaboration server Molecule tests
  hosts: all
  become: true
  gather_facts: true
  tasks:
    - name: Include roles for Excalidraw collaboration server Molecule tests
      ansible.builtin.include_role:
        name: "{{ role_name }}"
        public: true
      loop:
        - com.devture.ansible.role.playbook_help
        - com.devture.ansible.role.systemd_docker_base
        - "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') | basename }}"
      loop_control:
        loop_var: role_name

- name: Ensure Excalidraw collaboration server service is started
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Ensure systemd daemon is reloaded
      ansible.builtin.systemd_service:
        daemon_reload: true

    # `excalidraw_room_restart_necessary` is what a playbook's systemd service manager acts on,
    # and the role computes it out of every template, pull and build it performed. Honouring it
    # here is what makes a second converge against a live instance actually replace the container,
    # rather than leaving the previous one running while the verification reads the new
    # configuration off disk. It is also the only thing in this suite that exercises that
    # computation at all.
    - name: Ensure Excalidraw collaboration server systemd service is started
      ansible.builtin.systemd_service:
        name: excalidraw-room.service
        state: "{{ 'restarted' if excalidraw_room_restart_necessary | bool else 'started' }}"
